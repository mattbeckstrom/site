<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PNG Presentation</title>
    <!-- Reveal.js CSS from CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css">
    <style>
        .reveal .slides section {
            padding: 0;
        }
        .reveal .slides img {
            max-width: 100%;
            max-height: 95vh;
            object-fit: contain;
            margin: 0 auto;
            display: block;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="reveal">
        <div class="slides">
            <section>
                <img src="slide_001.png" alt="Slide 1">
            </section>
            <section>
                <img src="slide_002.png" alt="Slide 2">
            </section>
            <section>
                <img src="slide_003.png" alt="Slide 3">
            </section>
            <section>
                <img src="slide_004.png" alt="Slide 1">
            </section>
            <section>
                <img src="slide_005.png" alt="Slide 2">
            </section>
            <section>
                <img src="slide_006.png" alt="Slide 3">
            </section>
            <section>
                <img src="slide_007.png" alt="Slide 3">
            </section>
            <section>
                <img src="slide_008.png" alt="Slide 1">
            </section>
            <section>
                <img src="slide_009.png" alt="Slide 2">
            </section>
            <section>
                <img src="slide_0010.png" alt="Slide 3">
            </section>
            <section>
                <img src="slide_0011.png" alt="Slide 3">
            </section>
        </div>
    </div>

    <!-- Reveal.js Script from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.js"></script>
    <script>
        Reveal.initialize({
            hash: true,
            history: true,
            controls: true,
            progress: true,
            center: true,
            transition: 'slide' // none/fade/slide/convex/concave/zoom
        });
    </script>
</body>
</html>
